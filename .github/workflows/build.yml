name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        # No -G pin: use whatever Visual Studio the runner image ships.
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Stage runnable build
        shell: pwsh
        run: |
          New-Item -ItemType Directory stage/shaders -Force | Out-Null
          Copy-Item build/Release/HDRScopes.exe stage/
          Copy-Item shaders/*.hlsl, shaders/*.hlsli stage/shaders/

      - uses: actions/upload-artifact@v4
        with:
          name: HDRScopes-dev
          path: stage/
          retention-days: 7
